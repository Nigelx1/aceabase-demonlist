# Nigel's showcases, every 6 hours: a new upload of a level that's already on the
# site (Grind or demon page) replaces the old video within a few hours. Runs on
# GitHub's servers through tools/apply-edit.py (op refresh_showcases, upkeep mode:
# YouTube not answering skips, never fails); it only commits when one of his
# videos newly matches a level. The twice-weekly upkeep.yml does this too, with
# the AREDL re-sort; head mods have a "Check Nigel's channel" button on /admin/.
name: Showcase check
run-name: "Showcase check${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && ' (dry run)' || '' }}"

on:
  schedule:
    - cron: "41 */6 * * *"  # every 6 hours, at :41
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: show what would change, save nothing"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  showcases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install pillow

      - name: Use Nigel's showcases
        env:
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          python -c 'import json, secrets; print(json.dumps({"requestId": secrets.token_hex(8), "editor": "Upkeep", "role": "head", "upkeep": True, "ops": [{"op": "refresh_showcases"}]}))' > "$RUNNER_TEMP/payload.json"
          if [ "$DRY" = "true" ]; then
            python tools/apply-edit.py "$RUNNER_TEMP/payload.json" --dry-run
          else
            python tools/apply-edit.py "$RUNNER_TEMP/payload.json"
          fi
